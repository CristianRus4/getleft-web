<div class="lang-switcher">
  <label for="langSwitcher" class="visually-hidden" data-i18n="common.footer.language">Language</label>
  <select id="langSwitcher" aria-label="Language">
    <option value="en">English</option>
    <option value="es">Español (España)</option>
    <option value="es-419">Español (Latinoamérica)</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
    <option value="ja">日本語</option>
    <option value="nl">Nederlands</option>
    <option value="pl">Polski</option>
    <option value="tr">Türkçe</option>
    <option value="ru">Русский</option>
    <option value="zh-Hans">简体中文</option>
    <option value="zh-Hant">繁體中文</option>
    <option value="ko">한국어</option>
    <option value="id">Bahasa Indonesia</option>
    <option value="ro">Română</option>
  </select>
</div>
<script>
(function () {
  var sel = document.getElementById('langSwitcher');
  if (!sel) return;
  var SUPPORTED = ['en','es','es-419','de','fr','it','pt','ja','nl','pl','tr','ru','zh-Hans','zh-Hant','ko','id','ro'];
  var m = location.pathname.match(/^\/([a-zA-Z-]+)\//);
  var current = (m && SUPPORTED.indexOf(m[1]) >= 0) ? m[1] : 'en';
  sel.value = current;
  sel.addEventListener('change', function () {
    var v = sel.value;
    try { localStorage.setItem('left.lang', v); } catch (e) {}
    var bare = location.pathname.replace(/^\/[a-zA-Z-]+\//, '/');
    if (!new RegExp('^/(' + SUPPORTED.join('|') + ')(/|$)').test(location.pathname)) bare = location.pathname;
    location.href = (v === 'en' ? '' : '/' + v) + (bare === '/' ? '/' : bare) + location.search + location.hash;
  });
})();
</script>
