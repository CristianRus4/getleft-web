<div class="lang-switcher" data-lang-switcher>
  <a class="lang-switcher__button" href="#" role="button" aria-haspopup="listbox" aria-expanded="false" data-lang-switcher-button>
    <span data-current-language>EN</span>
  </a>
  <div class="lang-switcher__menu" role="listbox" aria-label="Language" hidden data-lang-switcher-menu>
__SWITCHER_OPTIONS__
  </div>
</div>
<script>
(function () {
  var root = document.querySelector('[data-lang-switcher]');
  if (!root) return;
  var trigger = root.querySelector('[data-lang-switcher-button]');
  var menu = root.querySelector('[data-lang-switcher-menu]');
  var label = root.querySelector('[data-current-language]');
  var options = Array.prototype.slice.call(root.querySelectorAll('[data-lang-option]'));
  if (!trigger || !menu || !label || !options.length) return;
  // Filled per page by scripts/build-i18n.mjs from i18n/locales.json.
  var LOCALES = __LOCALES_JSON__;
  var AVAILABLE = __AVAILABLE__;
  var SUPPORTED = Object.keys(LOCALES);
  var m = location.pathname.match(/^\/([a-zA-Z0-9-]+)\//);
  var current = (m && SUPPORTED.indexOf(m[1]) >= 0) ? m[1] : 'en';
  var currentLoc = LOCALES[current] || LOCALES.en;
  label.textContent = currentLoc.abbr || currentLoc.name;
  options.forEach(function (option) {
    var selected = option.getAttribute('data-lang-option') === current;
    option.setAttribute('aria-selected', selected ? 'true' : 'false');
  });
  function setOpen(open) {
    menu.hidden = !open;
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  trigger.addEventListener('click', function (event) {
    event.preventDefault();
    setOpen(menu.hidden);
  });
  options.forEach(function (option) {
    option.addEventListener('click', function () {
      var v = option.getAttribute('data-lang-option');
      if (!v) return;
      setOpen(false);
      var newLoc = LOCALES[v] || { name: v, abbr: v.toUpperCase() };
      label.textContent = newLoc.abbr || newLoc.name;
      options.forEach(function (item) {
        item.setAttribute('aria-selected', item === option ? 'true' : 'false');
      });
      try { localStorage.setItem('left.lang', v); } catch (e) {}
      var bare = location.pathname.replace(/^\/([a-zA-Z0-9-]+)\//, function (match, prefix) {
        return SUPPORTED.indexOf(prefix) >= 0 ? '/' : match;
      });
      // A page that has no version in the chosen language opens that language's home page.
      var newPath = v === 'en' ? bare : (AVAILABLE.indexOf(v) >= 0 ? '/' + v + bare : '/' + v + '/');
      location.href = newPath + (v === 'en' || AVAILABLE.indexOf(v) >= 0 ? location.search + location.hash : '');
    });
  });
  document.addEventListener('click', function (event) {
    if (!root.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') setOpen(false);
  });
})();
</script>
