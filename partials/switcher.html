<div class="lang-switcher" data-lang-switcher>
  <button class="lang-switcher__button" type="button" aria-haspopup="listbox" aria-expanded="false" data-lang-switcher-button>
    <span aria-hidden="true">&#9873;</span>
    <span data-current-language>English</span>
  </button>
  <div class="lang-switcher__menu" role="listbox" aria-label="Language" hidden data-lang-switcher-menu>
    <button type="button" role="option" data-lang-option="en">English</button>
    <button type="button" role="option" data-lang-option="es">Español (España)</button>
    <button type="button" role="option" data-lang-option="es-419">Español (Latinoamérica)</button>
    <button type="button" role="option" data-lang-option="de">Deutsch</button>
    <button type="button" role="option" data-lang-option="fr">Français</button>
    <button type="button" role="option" data-lang-option="it">Italiano</button>
    <button type="button" role="option" data-lang-option="pt">Português</button>
    <button type="button" role="option" data-lang-option="ja">日本語</button>
    <button type="button" role="option" data-lang-option="nl">Nederlands</button>
    <button type="button" role="option" data-lang-option="pl">Polski</button>
    <button type="button" role="option" data-lang-option="tr">Türkçe</button>
    <button type="button" role="option" data-lang-option="ru">Русский</button>
    <button type="button" role="option" data-lang-option="zh-Hans">简体中文</button>
    <button type="button" role="option" data-lang-option="zh-Hant">繁體中文</button>
    <button type="button" role="option" data-lang-option="ko">한국어</button>
    <button type="button" role="option" data-lang-option="id">Bahasa Indonesia</button>
    <button type="button" role="option" data-lang-option="ro">Română</button>
  </div>
</div>
<script>
(function () {
  var root = document.querySelector('[data-lang-switcher]');
  if (!root) return;
  var trigger = root.querySelector('[data-lang-switcher-button]');
  var menu = root.querySelector('[data-lang-switcher-menu]');
  var label = root.querySelector('[data-current-language]');
  var options = Array.prototype.slice.call(root.querySelectorAll('[data-lang-option]'));
  if (!trigger || !menu || !label || !options.length) return;
  var LOCALES = {
    en: 'English',
    es: 'Español (España)',
    'es-419': 'Español (Latinoamérica)',
    de: 'Deutsch',
    fr: 'Français',
    it: 'Italiano',
    pt: 'Português',
    ja: '日本語',
    nl: 'Nederlands',
    pl: 'Polski',
    tr: 'Türkçe',
    ru: 'Русский',
    'zh-Hans': '简体中文',
    'zh-Hant': '繁體中文',
    ko: '한국어',
    id: 'Bahasa Indonesia',
    ro: 'Română'
  };
  var SUPPORTED = Object.keys(LOCALES);
  var m = location.pathname.match(/^\/([a-zA-Z-]+)\//);
  var current = (m && SUPPORTED.indexOf(m[1]) >= 0) ? m[1] : 'en';
  label.textContent = LOCALES[current] || LOCALES.en;
  options.forEach(function (option) {
    var selected = option.getAttribute('data-lang-option') === current;
    option.setAttribute('aria-selected', selected ? 'true' : 'false');
  });
  function setOpen(open) {
    menu.hidden = !open;
    trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  trigger.addEventListener('click', function () {
    setOpen(menu.hidden);
  });
  options.forEach(function (option) {
    option.addEventListener('click', function () {
      var v = option.getAttribute('data-lang-option');
      if (!v) return;
      setOpen(false);
      label.textContent = LOCALES[v] || v;
      options.forEach(function (item) {
        item.setAttribute('aria-selected', item === option ? 'true' : 'false');
      });
      try { localStorage.setItem('left.lang', v); } catch (e) {}
      var bare = location.pathname.replace(/^\/[a-zA-Z-]+\//, '/');
      if (!new RegExp('^/(' + SUPPORTED.join('|') + ')(/|$)').test(location.pathname)) bare = location.pathname;
      location.href = (v === 'en' ? '' : '/' + v) + (bare === '/' ? '/' : bare) + location.search + location.hash;
    });
  });
  document.addEventListener('click', function (event) {
    if (!root.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') setOpen(false);
  });
})();
</script>
