<script>
(function () {
  try {
    // Filled per page by scripts/build-i18n.mjs from i18n/locales.json.
    var ALIASES = __LOCALE_ALIASES__;
    var AVAILABLE = __AVAILABLE__;
    var qp = new URLSearchParams(location.search).get('lang');
    var override = qp;
    if (!override) { try { override = localStorage.getItem('left.lang'); } catch (e) {} }
    if (qp) { try { localStorage.setItem('left.lang', qp); } catch (e) {} }
    if (override === 'en') return;
    if (location.search.indexOf('nolang=1') >= 0) return;
    function resolve(tag) {
      if (!tag) return null;
      var t = String(tag).toLowerCase();
      if (ALIASES[t]) return ALIASES[t];
      var base = t.split('-')[0];
      return ALIASES[base] || null;
    }
    var pick = override ? resolve(override) : null;
    if (!pick) {
      var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < prefs.length && !pick; i++) pick = resolve(prefs[i]);
    }
    if (!pick || pick === 'en' || AVAILABLE.indexOf(pick) < 0) return;
    var path = location.pathname.replace(/^\//, '');
    window.__leftLangRedirect = true;
    location.replace('/' + pick + '/' + path + location.search + location.hash);
  } catch (e) { /* fail open */ }
})();
</script>
