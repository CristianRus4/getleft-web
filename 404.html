      font-size: clamp(96px, 20vw, 160px);

      letter-spacing: -0.04em;
      line-height: 0.9;
      margin: 0 0 24px;
      opacity: 0.9;
    }

    .error-page h1 {
      font-size: clamp(32px, 5vw, 48px);
      margin: 0 0 16px;
    }

    .error-page p {
      font-size: clamp(17px, 2.4vw, 19px);
