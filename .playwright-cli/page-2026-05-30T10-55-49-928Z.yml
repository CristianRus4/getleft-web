    - generic [ref=e34]:
      - heading "How sleep cycles work" [level=2] [ref=e35]
      - paragraph [ref=e36]:
        - text: Sleep happens in cycles of approximately
        - strong [ref=e37]: 90 minutes
        - text: ", moving through light sleep, deep sleep (slow-wave sleep), and REM sleep. Waking mid-cycle — especially during deep sleep — causes"
        - emphasis [ref=e38]: sleep inertia
        - text: ": that groggy, disoriented feeling that can persist for 30 minutes or more."
      - paragraph [ref=e39]: Waking at the end of a complete cycle, when sleep is naturally lightest, feels much more natural. This calculator shows you the ideal wake times that align with cycle boundaries.
      - heading "The 15-minute fall-asleep buffer" [level=2] [ref=e40]
      - paragraph [ref=e41]: The calculator adds 15 minutes to your bedtime before starting the first cycle. This accounts for the average time it takes a healthy adult to fall asleep (known as sleep latency). If you tend to fall asleep faster or slower, adjust the times by 5–10 minutes accordingly.
      - heading "How many cycles do you need?" [level=2] [ref=e42]
      - list [ref=e43]:
        - listitem [ref=e44]:
          - strong [ref=e45]: 4 cycles (6 hours)
          - text: — minimum for most adults; you'll be functional but not optimal
        - listitem [ref=e46]:
          - strong [ref=e47]: 5 cycles (7.5 hours)
          - text: — ideal for most adults; good cognitive and physical performance
        - listitem [ref=e48]:
          - strong [ref=e49]: 6 cycles (9 hours)
          - text: — recommended after sleep debt, illness, or hard training
      - paragraph [ref=e50]: The National Sleep Foundation recommends 7–9 hours for adults (18–64). For teenagers, 8–10 hours; for children, more.
      - heading "Tips for better sleep timing" [level=2] [ref=e51]
      - list [ref=e52]:
        - listitem [ref=e53]: Consistent wake times are more important than consistent bedtimes for regulating your circadian rhythm
        - listitem [ref=e54]: Avoid caffeine for 6–8 hours before bed; its half-life is about 5–6 hours
        - listitem [ref=e55]: Exposure to morning sunlight resets your body clock and makes falling asleep easier at night
        - listitem [ref=e56]: Use Left to set a "lights out" countdown for 30 minutes before your target bedtime
