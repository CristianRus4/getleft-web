    - generic [ref=e35]:
      - heading "How this days since calculator works" [level=2] [ref=e36]
      - paragraph [ref=e37]: Enter the date and optional time of an event, and the calculator subtracts it from the current moment. The result updates automatically so you can see the exact number of days since the event began.
      - paragraph [ref=e38]: This is useful for anniversaries, sobriety dates, streaks, product launches, recovery timelines, and any milestone where the elapsed time matters.
      - heading "Common ways to use days since" [level=2] [ref=e39]
      - paragraph [ref=e40]: "People often search for days since a birthday, days since a breakup, days since quitting a habit, or days since a project started. The same calculation works for all of them: pick the start date and the elapsed count becomes visible."
      - paragraph [ref=e41]: In Left, this maps closely to Since and streak tracking. Once you know the date, you can keep it visible on your iPhone widget instead of recalculating it.
      - heading "Date and time accuracy" [level=2] [ref=e42]
      - paragraph [ref=e43]: The calculator uses your local browser time zone. If the original event happened in another time zone, enter the equivalent local date and time for the most accurate count.
