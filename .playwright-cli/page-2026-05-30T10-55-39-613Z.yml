      - heading "What counts as a business day?" [level=2] [ref=e27]
      - paragraph [ref=e28]: This tool treats Monday through Friday as business days and skips Saturdays and Sundays. It does not automatically remove public holidays because those vary by country, state, and workplace.
      - heading "Common deadline calculations" [level=2] [ref=e29]
      - paragraph [ref=e30]: Business-day offsets are common for contracts, payment terms, support SLAs, hiring timelines, shipping estimates, and project schedules. Searches like 30 business days from today or 10 working days ago use this exact calculation.
      - heading "Turn the result into a countdown" [level=2] [ref=e31]
      - paragraph [ref=e32]: After you calculate the target date, add it to Left as an Ahead date so the deadline stays visible on your Lock Screen or Home Screen.
