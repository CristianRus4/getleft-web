      - heading "Working hours vs calendar hours" [level=2] [ref=e33]
      - paragraph [ref=e34]: Calendar hours count every hour on the clock. Working hours count only the hours inside your workday schedule, usually Monday through Friday. That makes the result better for capacity planning, consulting estimates, and sprint planning.
      - heading "Breaks and schedules" [level=2] [ref=e35]
      - paragraph [ref=e36]: Set your workday start and end time, then subtract a daily break. The calculator multiplies that net workday by the number of weekdays in the range.
      - heading "Use it for deadlines" [level=2] [ref=e37]
      - paragraph [ref=e38]: A deadline that is 80 working hours away feels different from one that is 14 calendar days away. Convert the schedule into a real number, then track the final date in Left.
