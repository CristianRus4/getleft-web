name: Sync translation coverage to Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CristianRus4/translation-engine@961dc9ba871a3cc9fcc2667c6a8472b332d6ae63
        with:
          output: nexus-translations.json
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('nexus-project-sync')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Upload translation coverage
        env:
          NEXUS_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: >-
          curl --fail-with-body --silent --show-error
          -H "Authorization: Bearer $NEXUS_OIDC_TOKEN"
          -H "Content-Type: application/json"
          --data-binary @nexus-translations.json
          https://australia-southeast1-nexus-cristianrus.cloudfunctions.net/projectSync

