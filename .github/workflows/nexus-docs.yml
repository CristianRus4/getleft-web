name: Sync docs to Nexus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node docs/nexus/sync.mjs > nexus-docs.json
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('nexus-project-sync')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Upload documentation
        env:
          NEXUS_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: >-
          curl --fail-with-body --silent --show-error
          -H "Authorization: Bearer $NEXUS_OIDC_TOKEN"
          -H "Content-Type: application/json"
          --data-binary @nexus-docs.json
          https://australia-southeast1-nexus-cristianrus.cloudfunctions.net/projectSync
