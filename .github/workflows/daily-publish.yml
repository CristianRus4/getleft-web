name: Daily publish

# Publishes what i18n/publish-schedule.json makes due today (New Zealand date): moves due
# English pages out of scheduled/, builds the released locale copies, sitemap and hreflang,
# commits to main (Cloudflare Pages deploys the push) and tells IndexNow.
# Safe to run more than once a day: when nothing changed it commits nothing.

on:
  # GitHub runs scheduled workflows on a best-effort basis and sometimes drops a run (21 Oct 2026 never
  # fired). The job is idempotent, so the later times are backups that commit nothing once the day is done.
  schedule:
    - cron: "17 18 * * *" # 07:17 NZDT (06:17 NZST)
    - cron: "7 20 * * *" # 09:07 NZDT backup
    - cron: "7 22 * * *" # 11:07 NZDT backup
    - cron: "47 1 * * *" # 14:47 NZDT backup
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # sitemap lastmod comes from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scheduler self-test
        run: node scripts/check-publish.mjs --selftest

      - name: Build, commit and push
        id: publish
        env:
          LEFT_SKIP_I18N_GATE: "1" # the translation engine only exists on the owner's Mac
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Lanes push to main all day: if main moves under us, start again from the new tip.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git clean -fdq
            base=$(git rev-parse HEAD)
            node scripts/build.mjs
            git add -A
            if git diff --cached --quiet; then
              echo "Nothing to publish today."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            msg=$(node scripts/lib/publish.mjs --commit-message)
            git commit -q -m "$msg"
            if git push origin HEAD:main; then
              echo "Pushed: $msg"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved during attempt $attempt; retrying"
          done
          exit 1

      - name: IndexNow
        if: steps.publish.outputs.pushed == 'true'
        continue-on-error: true # the pages are live either way; Bing still reads the sitemap
        run: node scripts/indexnow.mjs --since "${{ steps.publish.outputs.base }}"
