            </a>
            <div class="lang-switcher__menu" role="listbox" aria-label="Language" hidden data-lang-switcher-menu>
              <button type="button" role="option" data-lang-option="id" aria-selected="false">Bahasa Indonesia</button>
              <button type="button" role="option" data-lang-option="de" aria-selected="false">Deutsch</button>
              <button type="button" role="option" data-lang-option="hi" aria-selected="false">हिन्दी</button>

              <button type="button" role="option" data-lang-option="es" aria-selected="false">Español (España)</button>
              <button type="button" role="option" data-lang-option="es-419" aria-selected="false">Español (Latinoamérica)</button>
              <button type="button" role="option" data-lang-option="fr" aria-selected="false">Français</button>
              <button type="button" role="option" data-lang-option="it" aria-selected="false">Italiano</button>
              <button type="button" role="option" data-lang-option="nl" aria-selected="false">Nederlands</button>
              <button type="button" role="option" data-lang-option="pl" aria-selected="false">Polski</button>
              <button type="button" role="option" data-lang-option="pt" aria-selected="false">Português</button>
              <button type="button" role="option" data-lang-option="ro" aria-selected="false">Română</button>
              <button type="button" role="option" data-lang-option="ru" aria-selected="false">Русский</button>
              <button type="button" role="option" data-lang-option="tr" aria-selected="false">Türkçe</button>
              <button type="button" role="option" data-lang-option="ko" aria-selected="false">한국어</button>
              <button type="button" role="option" data-lang-option="ja" aria-selected="false">日本語</button>
              <button type="button" role="option" data-lang-option="zh-Hans" aria-selected="false">简体中文</button>
              <button type="button" role="option" data-lang-option="zh-Hant" aria-selected="true">繁體中文</button>
            </div>
          </div>
          <script>
          (function () {
            var root = document.querySelector('[data-lang-switcher]');
            if (!root) return;
            var trigger = root.querySelector('[data-lang-switcher-button]');
            var menu = root.querySelector('[data-lang-switcher-menu]');
            var label = root.querySelector('[data-current-language]');
            var flagLabel = root.querySelector('[data-current-flag]');
            var options = Array.prototype.slice.call(root.querySelectorAll('[data-lang-option]'));
            if (!trigger || !menu || !label || !options.length) return;
            var LOCALES = {
              en: { name: 'English', flag: '⚑', abbr: 'ENG' },
              es: { name: 'Español (España)', flag: '⚑', abbr: 'ES' },
              'es-419': { name: 'Español (Latinoamérica)', flag: '⚑', abbr: 'LAT' },
              de: { name: 'Deutsch', flag: '⚑', abbr: 'DE' },
              fr: { name: 'Français', flag: '⚑', abbr: 'FR' },
              it: { name: 'Italiano', flag: '⚑', abbr: 'IT' },
              pt: { name: 'Português', flag: '⚑', abbr: 'PT' },
              ja: { name: '日本語', flag: '⚑', abbr: 'JA' },
              nl: { name: 'Nederlands', flag: '⚑', abbr: 'NL' },
              pl: { name: 'Polski', flag: '⚑', abbr: 'PL' },
              tr: { name: 'Türkçe', flag: '⚑', abbr: 'TR' },
              ru: { name: 'Русский', flag: '⚑', abbr: 'RU' },
              'zh-Hans': { name: '简体中文', flag: '⚑', abbr: 'ZH' },
              'zh-Hant': { name: '繁體中文', flag: '⚑', abbr: 'ZH' },
              ko: { name: '한국어', flag: '⚑', abbr: 'KO' },
              id: { name: 'Bahasa Indonesia', flag: '⚑', abbr: 'ID' },
              ro: { name: 'Română', flag: '⚑', abbr: 'RO' },
              hi: { name: 'हिन्दी', flag: '⚑', abbr: 'HI' }
            };
            var SUPPORTED = Object.keys(LOCALES);
            var m = location.pathname.match(/^\/([a-zA-Z0-9-]+)\//);
            var current = (m && SUPPORTED.indexOf(m[1]) >= 0) ? m[1] : 'en';
            var currentLoc = LOCALES[current] || LOCALES.en;
            label.textContent = currentLoc.abbr || currentLoc.name;
            if (flagLabel) flagLabel.textContent = currentLoc.flag;
            options.forEach(function (option) {
              var selected = option.getAttribute('data-lang-option') === current;
              option.setAttribute('aria-selected', selected ? 'true' : 'false');
            });
            function setOpen(open) {
              menu.hidden = !open;
              trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
            }
            trigger.addEventListener('click', function (event) {
              event.preventDefault();
              setOpen(menu.hidden);
            });
            options.forEach(function (option) {
              option.addEventListener('click', function (event) {
                var v = option.getAttribute('data-lang-option');
                if (!v) return;
                setOpen(false);
                var newLoc = LOCALES[v] || { name: v, flag: '', abbr: v.toUpperCase() };
                label.textContent = newLoc.abbr || newLoc.name;
                if (flagLabel) flagLabel.textContent = newLoc.flag;
                options.forEach(function (item) {
                  item.setAttribute('aria-selected', item === option ? 'true' : 'false');
                });
                try { localStorage.setItem('left.lang', v); } catch (e) {}
                // Strip any existing language prefix, then re-prefix for the new language.
                // Pages that are English-only (press, tools, privacy, terms, etc.) stay on
                // the English path regardless of the selected language.
                var bare = location.pathname.replace(/^\/([a-zA-Z0-9-]+)\//, function (match, prefix) {
                  return SUPPORTED.indexOf(prefix) >= 0 ? '/' : match;
                });
                var excludedPath = /^\/(privacy|terms|web|404|invite|blog|\.well-known|download|ios|android|press|tools)/.test(bare);
                var newPath = (excludedPath || v === 'en') ? bare : '/' + v + bare;
                location.href = newPath + location.search + location.hash;
              });
            });
            document.addEventListener('click', function (event) {
              if (!root.contains(event.target)) setOpen(false);
            });
            document.addEventListener('keydown', function (event) {
              if (event.key === 'Escape') setOpen(false);
            });
          })();
          </script>
          <!-- i18n:switcher:end -->
</nav>
