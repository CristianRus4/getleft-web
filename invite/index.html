<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Join Left</title>
  <meta name="description"
    content="You're invited you to connect on Left, the habit tracker, countdown, and life widgets app for iPhone." />
  <meta name="theme-color" content="#FF4F00" />
  <meta name="theme-color" content="#FF4F00" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex,nofollow" />

  <!-- Smart App Banner (iOS Safari) - app-argument passes the invite URL so
       tapping "Open" in the banner delivers the invite code to the app via
       the Universal Link handler (FriendsManager.handleIncomingURL). -->
  <meta name="apple-itunes-app" id="smart-banner-meta" content="app-id=6740155884" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Page layout */
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .invite-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(56px + 48px + env(safe-area-inset-top)) 24px 64px;
      text-align: center;
    }

    .invite-headline {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.4;
      color: var(--text);
      margin: 0 0 12px;
      max-width: 640px;
      position: relative;
      z-index: 1;
    }

    /* Text-highlight effect: tight band in the page's foreground color,
       text drops out to match the page background. */
    .invite-headline-hl {
      display: inline;
      background: var(--text);
      color: var(--bg);
      padding: 0px 8px 2px;
      border-radius: 6px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .invite-sub {
      font-size: clamp(15px, 2.5vw, 18px);
      color: var(--text-secondary);
      margin: 0 0 56px;
      max-width: 480px;
      line-height: 1.55;
    }

    /* "@username invited you to be friends on Left" subtitle */
    .invite-sub--join {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin: 2px 0 36px;
      max-width: 540px;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    /* Steps */
    .invite-steps {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-top: 96px;
    }

    .invite-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .invite-step-label {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      margin: 0;
    }

    /* QR + Download button row - mirrors .hero-download-group from the homepage */
    .invite-download-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .invite-footer { display: block; }
    }

    .invite-step-note {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0;
      line-height: 1.55;
    }

    /* Error state */
    .invite-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      max-width: 400px;
    }

    .invite-error h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      margin: 0;
    }

    .invite-error p {
      color: var(--text-secondary);
      margin: 0;
    }

    /* Footer on invite page */
    .invite-footer {
      display: none;
      /* hidden on mobile */
      text-align: center;
      padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--hairline);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: auto;
    }

    .invite-footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .invite-footer a:hover {
      color: var(--text);
    }

    .invite-footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-top: 8px;
    }

    /* Inviter avatar - completely hidden until photo loads */
    @keyframes avatar-bounce {
      0%   { transform: rotate(var(--av-r)) translateY(0px); }
      18%  { transform: rotate(var(--av-r)) translateY(-24px); }
      36%  { transform: rotate(var(--av-r)) translateY(0px); }
      54%  { transform: rotate(var(--av-r)) translateY(-12px); }
      70%  { transform: rotate(var(--av-r)) translateY(0px); }
      84%  { transform: rotate(var(--av-r)) translateY(-5px); }
      100% { transform: rotate(var(--av-r)) translateY(0px); }
    }

    .invite-avatar-wrap {
      --av-r: 0deg;
      flex-shrink: 0;
      position: relative;
      z-index: 0;
      width: 84px;
      height: 84px;
      border: 3px solid transparent;
      border-radius: 17px;
      overflow: hidden;
      /* slight overlap so avatar peeks behind headline */
      margin-bottom: -14px;
      background: transparent;
      transform: rotate(var(--av-r)) translateY(0px);
      /* start invisible with blur */
      opacity: 0;
      filter: blur(10px);
      transition: opacity 500ms ease, filter 500ms ease, border-color 500ms ease;
      cursor: pointer;
    }

    .invite-avatar-wrap.photo-ready {
      opacity: 1;
      filter: blur(0);
      border-color: var(--text);
    }

    .invite-avatar-wrap.is-bouncing {
      animation: avatar-bounce 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    .invite-avatar-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Loading dots shown while Firestore fetch is in-flight */
    .invite-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
    }

    .invite-loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: dot-pulse 1.2s ease-in-out infinite;
    }

    .invite-loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .invite-loading-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%            { transform: scale(1);   opacity: 1; }
    }

    @media (min-width: 768px) {
      .invite-avatar-wrap {
        width: 105px;
        height: 105px;
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>
  <nav class="top-nav top-nav--visible" aria-label="Primary">
    <div class="container nav-inner">
      <a href="/" class="brand" aria-label="Left home">Left</a>
      <div class="nav-trailing">
        <div class="nav-links">
          <a href="/#features" class="nav-link">Features</a>
        </div>
        <a class="btn btn-primary" href="https://apps.apple.com/us/app/left-widgets-for-time-left/id6740155884?itscg=30200&amp;itsct=apps_box_badge&amp;mttnsubad=6740155884" target="_blank" rel="noopener">Download</a>
      </div>
    </div>
  </nav>

  <main class="invite-wrap" id="invite-main">
    <!-- Content injected by JS below -->
  </main>

  <footer class="invite-footer">
    <div>Left - cntxt · Coded in NZ · © 2026</div>
    <nav class="invite-footer-links" aria-label="Footer">
      <a href="/">Home</a>
      <a href="/support.html">Support</a>
      <a href="/contact.html">Contact</a>
      <a href="https://apps.apple.com/app/id6740155884" target="_blank" rel="noopener">Download</a>
      <a href="http://cristianrus.me/apps/left" target="_blank" rel="noopener">Privacy</a>
    </nav>
  </footer>

  <script>
    (function () {
      var FIREBASE_PROJECT = "left-app-4ebe8";
      var params = new URLSearchParams(window.location.search);
      var inviteCode = params.get('invite');
      var main = document.getElementById('invite-main');

      var appStoreLink = 'https://apps.apple.com/us/app/left-widgets-for-time-left/id6740155884';

      if (!inviteCode) {
        main.innerHTML =
          '<div class="invite-error">' +
          '  <h1>Link invalid or expired</h1>' +
          '  <p>This invite link is invalid or has already expired. Ask your friend to send you a new one.</p>' +
          '  <a class="btn" href="/" style="margin-top:4px;">Learn about Left</a>' +
          '</div>';
        return;
      }

      var deepLink = 'https://go.getleft.app/invite?invite=' + encodeURIComponent(inviteCode);

      // Wire the Smart App Banner's "Open" button to deliver the invite code.
      // The app-argument must be set before the banner renders, so update the
      // meta tag content immediately while the page is still loading.
      (function () {
        var meta = document.getElementById('smart-banner-meta');
        if (meta) {
          meta.setAttribute('content', 'app-id=6740155884, app-argument=' + deepLink);
        }
      })();

      // Random tilt (±10°) - set BEFORE the avatar is shown so it appears already rotated
      var avatarRotation = (Math.random() * 20 - 10).toFixed(2);
      // var avatarOffsetX = 0; // always center-aligned for now
      var isBouncing = false;
      var periodicTimer = null;

      function renderPage(inviterName, photoURL) {
        // Headline: just the username (no @) with highlight
        // Subtitle: "Join @username on Left" without highlight
        var headlineInner, subtitleHTML;
        if (inviterName) {
          // Strip leading @ if present (we add it back only in subtitle)
          var displayName = inviterName.replace(/^@/, '');
          headlineInner = '<span class="invite-headline-hl">' + escapeHTML(displayName) + '</span>';
          subtitleHTML = '<p class="invite-sub invite-sub--join">@' + escapeHTML(displayName) + ' invited you to be friends on Left</p>';
        } else {
          headlineInner = '<span class="invite-headline-hl">You\'re invited to join Left</span>';
          subtitleHTML = '';
        }

        // Avatar block - only rendered when a photo URL is available
        var avatarHTML = '';
        if (photoURL) {
          var altText = inviterName ? escapeHTML(inviterName.replace(/^@/, '')) + '\'s profile photo' : 'Inviter profile photo';
          avatarHTML =
            '<div class="invite-avatar-wrap" id="invite-avatar-wrap">' +
            '<img id="invite-avatar-img" src="' + escapeHTML(photoURL) + '" alt="' + altText + '" fetchpriority="high" decoding="async" />' +
            '</div>';
        }

        main.innerHTML =
          avatarHTML +
          '<h1 class="invite-headline" id="invite-headline">' + headlineInner + '</h1>' +
          subtitleHTML +

          '<div class="invite-steps">' +

          '<div class="invite-step">' +
          '<p class="invite-step-label">Download Left free</p>' +
          '<div class="invite-download-row hero-download-group">' +
          '<div class="qr-flip bento-cell" tabindex="0" role="button" aria-label="QR code - tap for instructions">' +
          '<div class="bento-inner">' +
          '<div class="bento-face qr-face-front"><div class="qr-mask"></div></div>' +
          '<div class="bento-face bento-face-back">' +
          '<p class="qr-face-back-text">Scan with your camera to find Left on the App Store. Or search <strong>"Left"</strong> on the App Store.</p>' +
          '</div>' +
          '</div>' +
          '</div>' +
          '<a class="dl-btn" href="' + appStoreLink + '" target="_blank" rel="noopener" aria-label="Download on the App Store">' +
          '<svg class="dl-btn-apple" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.925-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>' +
          'Download for iOS' +
          '</a>' +
          '</div>' +
          '</div>' +

          '<div class="invite-step">' +
          '<p class="invite-step-label">Have the app? Open the invite</p>' +
          '<a class="invite-accept-btn dl-btn" id="invite-accept-btn" href="' + deepLink + '">Open invite</a>' +
          '</div>' +

          '</div>';

        // Avatar animation logic
        if (photoURL) {
          var img  = document.getElementById('invite-avatar-img');
          var wrap = document.getElementById('invite-avatar-wrap');

          if (wrap) {
            // Set rotation BEFORE the avatar becomes visible so it appears already tilted
            wrap.style.setProperty('--av-r', avatarRotation + 'deg');
            // avatarOffsetX commented out - always center aligned
            // wrap.style.setProperty('--av-x', avatarOffsetX + 'px');
          }

          // Internal bounce: just triggers the CSS animation (rotation already set)
          function doBounce() {
            if (!wrap || isBouncing) return;
            isBouncing = true;
            wrap.classList.remove('is-bouncing');
            void wrap.offsetWidth; // force reflow
            wrap.classList.add('is-bouncing');
          }

          // Public entry point: set a new random rotation, THEN bounce
          function triggerBounceWithNewRotation() {
            if (!wrap || isBouncing) return;
            avatarRotation = (Math.random() * 20 - 10).toFixed(2);
            wrap.style.setProperty('--av-r', avatarRotation + 'deg');
            // Small tick so the CSS variable is flushed before animation starts
            requestAnimationFrame(function () { doBounce(); });
          }

          if (wrap) {
            wrap.addEventListener('animationend', function () {
              wrap.classList.remove('is-bouncing');
              isBouncing = false;
            });
            // Tap: rotate then bounce
            wrap.addEventListener('click', triggerBounceWithNewRotation);
          }

          function onPhotoLoaded() {
            if (!wrap) return;
            // Make avatar visible - it's already at the correct rotation
            wrap.classList.add('photo-ready');
            // First bounce plays immediately as it fades in
            setTimeout(doBounce, 30);
            // Periodic bounce every 7 s - rotates first each time
            if (periodicTimer) clearInterval(periodicTimer);
            periodicTimer = setInterval(triggerBounceWithNewRotation, 7000);
          }

          if (img) {
            if (img.complete && img.naturalWidth) {
              onPhotoLoaded();
            } else {
              img.addEventListener('load',  onPhotoLoaded);
              img.addEventListener('error', function () { if (wrap) wrap.style.display = 'none'; });
            }
          }
        }
      }

      // Build a Firebase Storage public download URL from a storage path
      function storageURL(path) {
        if (!path || !path.trim()) return null;
        var bucket = FIREBASE_PROJECT + '.firebasestorage.app';
        return 'https://firebasestorage.googleapis.com/v0/b/' + bucket + '/o/' + encodeURIComponent(path.trim()) + '?alt=media';
      }

      function escapeHTML(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Show a loading indicator while fetching - do NOT render until we know
      // whether there is a username, to avoid flashing the generic fallback.
      main.innerHTML =
        '<div class="invite-loading" aria-label="Loading">' +
        '<div class="invite-loading-dot"></div>' +
        '<div class="invite-loading-dot"></div>' +
        '<div class="invite-loading-dot"></div>' +
        '</div>';

      // friendInvites/{inviteCode} - document ID IS the invite code.
      // The app now writes inviterUsername and profilePhotoPath directly into the
      // document, so a single fetch is all we need. No auth required (rules allow get: true).
      var inviteDocURL = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT + '/databases/(default)/documents/friendInvites/' + encodeURIComponent(inviteCode);

      // custom scheme - used only as button fallback, never auto-fired
      var customSchemeLink = 'left://friends/invite?invite=' + encodeURIComponent(inviteCode);

      // Universal Link (go.getleft.app) is the primary mechanism.
      // When the shared URL (go.getleft.app/invite?invite=CODE) is opened from
      // Messages, Mail, Notes, etc., iOS intercepts it before Safari loads and
      // opens the app directly - zero prompt, zero browser. That path never
      // reaches this page at all.
      //
      // This page only loads when:
      //   a) the app is not installed (Universal Link fell through to Safari), or
      //   b) the user opened the link from inside Safari itself.
      //
      // In case (b), we can still try to open the app via the custom scheme on
      // button tap - the user will see an iOS confirmation prompt, which is
      // unavoidable when already inside Safari. There is no prompt-free way to
      // open an app from within Safari.
      //
      // "Open invite" button: try left:// first (opens app if installed),
      // fall back to App Store after 1.5s if the app didn't open.
      function wireAcceptButton() {
        var btn = document.getElementById('invite-accept-btn');
        if (!btn) return;
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          window.location.href = customSchemeLink;
          var fallbackTimer = setTimeout(function () {
            window.location.href = appStoreLink;
          }, 1500);
          document.addEventListener('visibilitychange', function onVis() {
            if (document.hidden) {
              clearTimeout(fallbackTimer);
              document.removeEventListener('visibilitychange', onVis);
            }
          });
        });
      }

      // The QR is a visual hover reveal; keep the App Store link as the only control.
      function prepareQrReveal() {
        document.querySelectorAll('.qr-flip.bento-cell').forEach(function (cell) {
          cell.removeAttribute('tabindex');
          cell.removeAttribute('role');
          cell.removeAttribute('aria-label');
        });
      }

      // Size the expanded QR square to match the dl-btn width (matches index.js)
      function syncQrSize() {
        document.querySelectorAll('.hero-download-group, .download-group').forEach(function (group) {
          var btn = group.querySelector('.dl-btn');
          var qr = group.querySelector('.qr-flip');
          if (!btn || !qr) return;
          var w = btn.getBoundingClientRect().width;
          if (w > 0) {
            group.style.setProperty('--download-control-size', w + 'px');
          }
        });
      }

      function syncInviteButtonSize() {
        var downloadBtn = document.querySelector('.invite-download-row .dl-btn');
        var inviteBtn = document.getElementById('invite-accept-btn');
        if (!downloadBtn || !inviteBtn) return;
        var w = downloadBtn.getBoundingClientRect().width;
        if (w > 0) inviteBtn.style.setProperty('width', w + 'px', 'important');
      }

      window.addEventListener('resize', syncQrSize, { passive: true });
      window.addEventListener('resize', syncInviteButtonSize, { passive: true });

      // Patch renderPage to wire the button + QR after each render
      var _origRenderPage = renderPage;
      renderPage = function (inviterName, photoURL) {
        _origRenderPage(inviterName, photoURL);
        wireAcceptButton();
        prepareQrReveal();
        syncQrSize();
        syncInviteButtonSize();
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () {
            syncQrSize();
            syncInviteButtonSize();
          });
        }
      };

      fetch(inviteDocURL)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (doc) {
          if (!doc || !doc.fields) { renderPage(null, null); return; }
          var fields = doc.fields;

          // profilePhotoPath written by the app - convert to a public Storage URL
          var photoPath = fields.profilePhotoPath && fields.profilePhotoPath.stringValue;
          var photo = storageURL(photoPath);

          // inviterUsername written directly by the app - use it immediately
          var username = fields.inviterUsername && fields.inviterUsername.stringValue;
          if (username && username.trim()) {
            // Pass username without @ - renderPage handles the @ in the subtitle
            renderPage(username.trim(), photo);
            return;
          }

          // Fallback for old invites: fetch publicProfiles
          var inviterID = fields.inviterId && fields.inviterId.stringValue;
          if (!inviterID) { renderPage(null, null); return; }

          var profileURL = 'https://firestore.googleapis.com/v1/projects/' + FIREBASE_PROJECT + '/databases/(default)/documents/publicProfiles/' + encodeURIComponent(inviterID);
          return fetch(profileURL)
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (profileDoc) {
              if (!profileDoc || !profileDoc.fields) { renderPage(null, null); return; }
              var pf = profileDoc.fields;
              var u = pf.username && pf.username.stringValue;
              var dn = pf.userName && pf.userName.stringValue;
              // Pass username without @ - renderPage handles the @ in the subtitle
              var name = (u && u.trim()) ? u.trim() : (dn && dn.trim()) || null;
              renderPage(name || null, photo);
            });
        })
        .catch(function () {
          // Fetch failed - show generic fallback
          renderPage(null, null);
        });
    })();
  </script>
</body>

</html>
